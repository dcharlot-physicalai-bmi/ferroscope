[package]
name = "ferroscope-cli"
description = "The Ferroscope CLI: inspect, verify and compare robot recordings. Determinism receipts and a joules axis, installed as the `ferroscope` binary."
# 0.1.1, while the libraries stay at 0.1.0: 0.1.0 of this crate installed a binary called
# `ferroscope-cli`, because an unanchored rename of `name = "ferroscope"` hit the [[bin]] name
# as well as the package name. The libraries were never affected and are not being churned.
# 0.1.3: the built-in demo carries a real glTF mesh as an attachment.
# 0.1.4 adds the `urdf` verb: record YOUR robot from its own description.
# 0.1.5 adds `urdf --check` and the collision and inertial layers.
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["robotics", "mcap", "observability", "determinism", "energy"]
categories = ["science::robotics", "command-line-utilities", "visualization"]

[dependencies]
ferroscope-mcap = { workspace = true }
ferroscope-schema = { workspace = true }
ferroscope-ledger = { workspace = true }
ferroscope-receipt = { workspace = true }
ferroscope-urdf = { workspace = true }
ferroscope-mesh = { workspace = true }
ferroscope-scene = { workspace = true }

# The package is `ferroscope-cli`; the binary is `ferroscope`. CI's end-to-end job runs
# `target/release/ferroscope`, so this line has a test.
[[bin]]
name = "ferroscope"
path = "src/main.rs"
