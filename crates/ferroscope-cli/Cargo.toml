[package]
name = "ferroscope-cli"
description = "The Ferroscope CLI: inspect, verify and compare robot recordings. Determinism receipts and a joules axis, installed as the `ferroscope` binary."
# 0.1.1, while the libraries stay at 0.1.0: 0.1.0 of this crate installed a binary called
# `ferroscope-cli`, because an unanchored rename of `name = "ferroscope"` hit the [[bin]] name
# as well as the package name. The libraries were never affected and are not being churned.
# 0.1.3: the built-in demo carries a real glTF mesh as an attachment.
# 0.1.4 adds the `urdf` verb: record YOUR robot from its own description.
# 0.1.5 adds `urdf --check` and the collision and inertial layers.
# 0.1.11 adds `live`: replay any recording as a live stream, WebSocket by default and
# WebTransport behind `--features webtransport`.
# 0.1.17: `export` help says what a bundle is for — seeing a run too big for a browser.
# 0.1.16: a robot's mount point reaches the recording (it was honoured only when reporting
# ground clearance), and a floor breach now prints the mount height that fixes it.
# 0.1.15: diff ranks channels by |delta| against each channel's own scale, so a signal's zero
# crossings no longer outrank the real finding, and shape is summarised by each window's envelope.
# 0.1.14: diff qualifies its headline when the two runs did not record the same things.
# 0.1.13: `diff` recomputes both receipts instead of trusting stored metadata, and reports
# onset / crossing / shape / ranked extent / energy delta rather than one first-in-emit-order hit.
# 0.1.12: `live` binds 8737 (the port the viewer's live button dials) instead of an ephemeral
# one, reports the span it can actually pace, cannot panic on --rate/--hold, and tells the
# truth about how many viewers received the sealed file.
# 0.1.22: `diff` no longer holds either trajectory. Deciding WHERE two runs parted is a fold
# over pairs in file order, so both files are walked at once and the pairs fed straight in:
# 2.34 GB to 39-61 MB on a 527 MB pair, byte-identical output. Pairs that do not line up are
# refused and fall back to building both traces rather than being paired by guesswork.
# 0.1.23: `energy` streams too — a ledger is a fold. 1,231 MB to 44 MB on a 527 MB recording.
# 0.1.24 adds `--resolution <q>|<channel>=<q>` to `demo` and `scene`: declare what the receipt
# claims, in the channel's own units. It turns "agrees at 20 dropped mantissa bits" into
# "agrees to a nanoradian" — the same fact, said about the physics rather than the float.
# 0.1.25: `diff` reports what a declared resolution must clear, and deliberately suggests no
# number — measured over six pairs, the smallest that worked ran 1x to 109x the summed
# difference, so a 10x rule is wrong twice in six and a suggestion that fails is worse than
# none.
# 0.1.26 adds `diff --declare`: the resolution each channel would have to declare for these
# two runs to hash alike, measured. Off by default for the report's sake, not the clock — it
# costs about 1% of CPU.
# 0.1.27: `urdf` resolves a built-in robot name, as `scene` already did. The two disagreed —
# a scene could say "so101" and `ferroscope urdf so101` could not — and an unknown name now
# says which robots ARE built in. Found by installing the published crate into an empty
# directory and using it the way a reader would.
# 0.1.28: reads the compression the world actually writes (zstd and lz4 chunks, pure-Rust
# decoders, so the browser build survives), and `inspect --recover` reads a recording that stops
# mid-record instead of refusing all of it. `verify` now names WHY it failed rather than
# blaming a missing receipt for every cause.
version = "0.1.28"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["robotics", "mcap", "observability", "determinism", "energy"]
categories = ["science::robotics", "command-line-utilities", "visualization"]

[dependencies]
ferroscope-mcap = { workspace = true }
ferroscope-schema = { workspace = true }
ferroscope-ledger = { workspace = true }
ferroscope-receipt = { workspace = true }
ferroscope-urdf = { workspace = true }
ferroscope-mesh = { workspace = true }
ferroscope-scene = { workspace = true }
ferroscope-power = { workspace = true }
ferroscope-phrase = { workspace = true }
ferroscope-live = { workspace = true }

[features]
## WebTransport replay (`ferroscope live --wt`): HTTP/3 over QUIC and a one-click viewer link.
## Off by default so the stock install keeps the workspace's zero-dependency claim.
webtransport = ["ferroscope-live/webtransport"]

# The package is `ferroscope-cli`; the binary is `ferroscope`. CI's end-to-end job runs
# `target/release/ferroscope`, so this line has a test.
[[bin]]
name = "ferroscope"
path = "src/main.rs"
