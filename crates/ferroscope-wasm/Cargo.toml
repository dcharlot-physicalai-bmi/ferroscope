[package]
name = "ferroscope-wasm"
description = "Ferroscope in the browser: open a recording, verify its receipt, and diff two runs, entirely client-side. No server, no upload, no account."
# 0.1.1 tracks the bundle gaining geometry and frame tracks for the 3-D panel.
# 0.1.2 adds the attachment() accessor the 3-D panel loads glTF through.
# 0.1.10 adds `BundleStream`: push a recording through in `File.slice()` blocks, twice, and a
# 2.6 GiB run that `file.arrayBuffer()` refuses outright opens in 78.8 s under 200 MB of heap
# — with its receipt recomputed HERE rather than inherited from an export.
# 0.1.11 adds `DiffStream`: compare two recordings the browser cannot hold. Three passes each
# — receipts, then digests and labels, then the two runs walked together — and the JSON it
# returns is character for character what `diff` returns from bytes. Measured: two 1.3 GB
# recordings compared in 122 s with a 108 MB heap.
# 0.1.12 adds `AttachmentStream`: pull one mesh out of a recording the browser cannot hold.
# A glTF has to be whole to be a mesh, so a block read kept the declaration and not the bytes;
# this goes back to the file and stops at the attachment — 2.0% of the file for a 76 KB mesh.
version = "0.1.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wasm", "robotics", "mcap", "viewer", "determinism"]
categories = ["wasm", "science::robotics", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

# The one dependency in the project, and it is the binding layer rather than the work:
# everything below `wasm_bindgen` is the same zero-dependency code the CLI runs.
[dependencies]
wasm-bindgen = "0.2"
ferroscope-schema = { workspace = true }
ferroscope-receipt = { workspace = true }
# The whole authoring path in the tab: an English phrase becomes a scene becomes a recording,
# with no request and nothing uploaded — the same claim the rest of the viewer already makes.
ferroscope-scene = { workspace = true }
ferroscope-phrase = { workspace = true }

[dev-dependencies]
# Only the tests need to WRITE a recording; the crate itself only reads them.
ferroscope-ledger = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
