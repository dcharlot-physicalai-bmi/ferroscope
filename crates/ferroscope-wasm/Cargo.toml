[package]
name = "ferroscope-wasm"
description = "Ferroscope in the browser: open a recording, verify its receipt, and diff two runs, entirely client-side. No server, no upload, no account."
# 0.1.1 tracks the bundle gaining geometry and frame tracks for the 3-D panel.
# 0.1.2 adds the attachment() accessor the 3-D panel loads glTF through.
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["wasm", "robotics", "mcap", "viewer", "determinism"]
categories = ["wasm", "science::robotics", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

# The one dependency in the project, and it is the binding layer rather than the work:
# everything below `wasm_bindgen` is the same zero-dependency code the CLI runs.
[dependencies]
wasm-bindgen = "0.2"
ferroscope-schema = { workspace = true }
ferroscope-receipt = { workspace = true }
# The whole authoring path in the tab: an English phrase becomes a scene becomes a recording,
# with no request and nothing uploaded — the same claim the rest of the viewer already makes.
ferroscope-scene = { workspace = true }
ferroscope-phrase = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
