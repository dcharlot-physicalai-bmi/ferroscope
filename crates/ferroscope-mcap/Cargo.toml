[package]
name = "ferroscope-mcap"
description = "MCAP v0 reader and writer: zero dependencies by default, pure Rust throughout, builds for wasm32 unchanged — including optional zstd and lz4 chunk reading, in a browser."
# 0.1.1 adds Attachment records: write, read, index and CRC-check.
# 0.1.2 adds Error::SchemaConflict, so one topic cannot silently carry two schemas.
# 0.1.8 adds `Feed`: the framing, PUSHED rather than pulled, so a browser can hand a
# recording over one `File.slice()` at a time. `stream` is now a loop over it, which keeps
# one definition of what a record is for both directions.
# 0.1.9 READS zstd and lz4 chunks behind optional features. Reading only what we write is not
# interoperability: `ros2 bag record` and Foxglove write zstd by default, so uncompressed-only
# meant we could not open a real robot log.
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcap", "robotics", "logging", "wasm", "no-deps"]
categories = ["science::robotics", "encoding", "wasm"]

# Zero dependencies by default, on purpose. The reference `mcap` crate links zstd and lz4 as C
# libraries, carried whether or not a given file is compressed, and that is what keeps robotics
# log tooling off wasm32.
#
# WRITING is unchanged: uncompressed chunks, a conforming MCAP profile every reader must accept.
# READING is not a choice we get to make -- the files already exist, and `ros2 bag record` and
# Foxglove write zstd. So the codecs are optional features, default OFF, and both decoders are
# PURE RUST. That is the whole point: they build for wasm32 unchanged, so a browser tab opens a
# real robot log, which the C-linked implementations cannot do at any price.
#
# The reference implementation appears below as a *dev*-dependency, where it belongs: it is the
# oracle the round-trip tests check this reader and writer against, and it is what writes the
# genuinely-compressed files the codec tests read.
[dependencies]
ruzstd = { version = "0.9.0", optional = true }
lz4_flex = { version = "0.14.0", optional = true, default-features = false, features = ["frame"] }

[features]
default = []
zstd = ["dep:ruzstd"]
lz4 = ["dep:lz4_flex"]
compression = ["zstd", "lz4"]

[dev-dependencies]
mcap = "0.25"
