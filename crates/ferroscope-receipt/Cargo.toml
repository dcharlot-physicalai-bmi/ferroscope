[package]
name = "ferroscope-receipt"
description = "Determinism receipts for physics runs: a canonical run digest, a tunable-precision trace digest, and a comparator that names the step a replay diverged at."
# 0.1.1: the comparator reports independent absolute/relative worsts, names the largest
# difference in a diverging sample rather than the first in emit order, and gains profile():
# onset, shape, ranked extent, structural localisation, and spec field differences.
# 0.1.5 adds `Comparison` and `Pairwise`: the verdict and the divergence profile as folds over
# matched pairs. `compare` and `profile` are loops over them, so a streaming comparator and a
# held one cannot become two answers to one question.
# 0.1.6: a channel may DECLARE an absolute resolution, so a quantity that passes through zero
# is hashed on a fixed grid rather than against its own vanishing magnitude. Measured: one
# control channel forced a whole recording to drop_bits 51 of 52. A recording that declares
# nothing produces the identical digest it always did.
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["determinism", "reproducibility", "robotics", "simulation", "sha256"]
categories = ["science::robotics", "cryptography", "simulation"]

# std only. A receipt whose verification needs a dependency tree is a receipt nobody checks.
[dependencies]
