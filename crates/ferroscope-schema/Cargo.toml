[package]
name = "ferroscope-schema"
description = "The Ferroscope recording model: three-clock timestamps, entity paths, well-known JSON schemas any MCAP viewer can already render, and a recorder that seals each run with its own receipt."
# 0.1.1 adds Value::to_json / brief / path, which ferroscope-run needs in order to store and
# query a run record. Additive, so every 0.1.0 dependant resolves to it unchanged. (This is the
# third time an unanchored `version` replace has bitten in this repo: `version.workspace` is a
# substring of `rust-version.workspace`.)
# 0.1.3 adds Shape::Mesh, Recorder::attach, and attachments in the viewer bundle.
# 0.1.4: the Recorder refuses a topic reuse with a different schema.
# 0.1.5: a sphere's size is its three semi-axes, so one primitive draws an inertia ellipsoid.
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["robotics", "mcap", "schema", "telemetry", "observability"]
categories = ["science::robotics", "encoding", "simulation"]

[dependencies]
ferroscope-mcap = { workspace = true }
ferroscope-ledger = { workspace = true }
ferroscope-receipt = { workspace = true }
