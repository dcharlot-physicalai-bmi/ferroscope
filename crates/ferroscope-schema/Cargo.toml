[package]
name = "ferroscope-schema"
description = "The Ferroscope recording model: three-clock timestamps, entity paths, well-known JSON schemas any MCAP viewer can already render, and a recorder that seals each run with its own receipt."
# 0.1.1 adds Value::to_json / brief / path, which ferroscope-run needs in order to store and
# query a run record. Additive, so every 0.1.0 dependant resolves to it unchanged. (This is the
# third time an unanchored `version` replace has bitten in this repo: `version.workspace` is a
# substring of `rust-version.workspace`.)
# 0.1.3 adds Shape::Mesh, Recorder::attach, and attachments in the viewer bundle.
# 0.1.4: the Recorder refuses a topic reuse with a different schema.
# 0.1.5: a sphere's size is its three semi-axes, so one primitive draws an inertia ellipsoid.
# 0.1.14 adds `BundleFold`: the viewer bundle folded from PUSHED blocks, so a page can open a
# recording the browser will not hand over as one buffer. `bundle_streaming` is now this fold
# with a file loop around it, and a fold whose second pass sees a different recording than its
# first refuses rather than emitting partial lanes.
# 0.1.15 adds `profile_streaming`: compare two recordings by walking both files at once,
# holding neither trajectory. Refuses any pair whose samples do not line up rather than
# guessing which sample belongs with which. `receipt_streaming` reads a receipt and no payloads.
# 0.1.16 turns the streaming comparison inside out into `PairStream`, which is PUSHED: feed
# both files as their blocks arrive rather than reading them. `profile_streaming` is a loop
# over it, so a browser and the CLI compare two runs the same way.
# 0.1.17: `PairStream` matches by STEP rather than by position. A channel that fires
# conditionally (a contact, while the body is against its stop) makes two genuinely diverged
# runs stop emitting the same samples at the same steps — the exact pair anybody wants
# compared — and position matching refused it: a 1.3 GB pair fell back to 4 GB of trajectories
# and now costs 95 MB. `VerifyFold` is the pushed form of `verify_streaming`.
# 0.1.18 adds `metadata_streaming`: read one metadata block while parsing no payloads, so
# "what did producing this file cost?" costs one pass rather than the whole recording.
# 0.1.19 adds `Recorder::resolution`, which declares a channel's absolute resolution before
# the first value is hashed — and refuses afterwards, because hashing one run two different
# ways is not a receipt.
# 0.1.20 adds `Recorder::default_resolution`.
# 0.1.21 threads the resolution sieve through `profile_streaming_declaring`.
# 0.1.22: the stored `clock.max_lag_ns` keeps its SIGN. It was an absolute value, so a run
# that finished ahead of real time was indistinguishable in the file from one falling behind —
# while `inspect`, recomputing from the messages, reported both correctly. Informational only:
# the field is not hashed, and every recording sealed before this still verifies.
# 0.1.23 is a MANIFEST change only, and worth a version for what it enables: it takes
# ferroscope-mcap 0.1.9 with the chunk codecs on, so the recording model can read what
# `ros2 bag record` and Foxglove actually write. No source in this crate changed.
version = "0.1.23"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["robotics", "mcap", "schema", "telemetry", "observability"]
categories = ["science::robotics", "encoding", "simulation"]

[dependencies]
ferroscope-mcap = { workspace = true }
ferroscope-ledger = { workspace = true }
ferroscope-receipt = { workspace = true }
