name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    # The claim on the tin: the four libraries build for the browser unchanged. A claim that
    # is not in CI is a claim that has already stopped being true somewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: >
          cargo build --target wasm32-unknown-unknown
          -p ferroscope-mcap -p ferroscope-ledger -p ferroscope-receipt -p ferroscope-schema
          -p ferroscope-wasm

  harness:
    # The scenario harness end to end: discover, run a suite, query history, and compare two
    # runs of the same case. `run` exits 1 when a case fails, which the acceptance suite does
    # on purpose, so the smoke suite is the gate here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example hopper -p ferroscope-run
      - name: declare, run, query, compare
        run: |
          H=target/release/examples/hopper
          $H collect --json > /dev/null
          $H suites
          # `! cmd` asserts NOTHING under `set -e`: the shell suppresses -e for an inverted
          # command, so a suite that started passing would have sailed through. Captured.
          rc=0; $H run --suite acceptance > /dev/null || rc=$?
          test "$rc" -eq 1 || { echo "the acceptance suite must fail (5 of 13 by design), got $rc"; exit 1; }
          $H run --scenario budget               # this one must pass: exit 0
          $H list --limit 5
          $H list --result 'worst_penetration_m:>:0.08' --json > /dev/null
          $H run --scenario hop --case stiffness=8000 > /dev/null
          A=$($H list --scenario hop --case stiffness=8000 --limit 2 --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"])')
          B=$($H list --scenario hop --case stiffness=8000 --limit 2 --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[1]["id"])')
          $H compare "$A" "$B"                   # same spec, same body: must reproduce

  urdf:
    # Point the verb at the shipped description and check that what comes out is a scene: one
    # visual channel per link, one transform channel per link, and a receipt that verifies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: the checker passes a sound description and refuses a broken one
        # This is the gate the survey said nobody ships: a robot description checked for the
        # errors that break sim-to-real, before anything is simulated.
        run: |
          B=target/release/ferroscope
          $B urdf examples/robots/arm.urdf /tmp/ok.mcap --check
          rc=0; $B urdf examples/robots/broken.urdf /tmp/bad.mcap --check > /dev/null || rc=$?
          test "$rc" -eq 1 || { echo "a broken description must exit 1, got $rc"; exit 1; }
          $B urdf examples/robots/broken.urdf /tmp/bad.mcap --check 2>&1 | tee /tmp/bad.txt || true
          for kind in no-collision no-inertial zero-inertia triangle-inequality \
                      not-positive-definite bad-mass; do
            grep -q "$kind" /tmp/bad.txt || { echo "the checker missed $kind"; exit 1; }
          done
          echo "every defect class is caught"
      - name: the SO-101 demo device is sound, and --check writes nothing
        # The SO-101 carries the real calibrated kinematics and inertials, so it is the closest
        # thing here to a third-party description: if the checker ever starts failing a shipped
        # commercial arm, that is a bug in the checker and this is where it surfaces.
        run: |
          B=$PWD/target/release/ferroscope
          cd "$(mktemp -d)"
          $B urdf "$GITHUB_WORKSPACE/examples/robots/so101.urdf" --check | tee /tmp/so101.txt
          grep -q "0 that fail" /tmp/so101.txt || { echo "the SO-101 no longer checks clean"; exit 1; }
          # --check must not be swallowed as the output path. It was, and a 1.4 MB file named
          # `--check` appeared in the working directory while the exit code stayed correct.
          test ! -e './--check' || { echo "--check was treated as a filename"; exit 1; }
          test -z "$(ls -A)" || { echo "--check wrote something: $(ls -A)"; exit 1; }
          echo "the SO-101 checks clean and --check writes nothing"
      - name: a URDF becomes a verified recording
        run: |
          B=target/release/ferroscope
          $B urdf examples/robots/arm.urdf arm.mcap --steps 120
          $B verify arm.mcap
          $B inspect arm.mcap | tee /tmp/arm.txt
          for link in base shoulder_link upper_arm forearm gripper; do
            for layer in visual collision inertial; do
              grep -q "/scene/$layer/$link" /tmp/arm.txt \
                || { echo "no $layer geometry for $link"; exit 1; }
            done
            grep -q "/scene/tf/$link" /tmp/arm.txt || { echo "no transform for $link"; exit 1; }
          done
          # Every geometry channel must carry the Geometry schema and every tf channel Transform.
          # This is the bug that shipped once: transforms written onto geometry channels.
          for layer in visual collision inertial; do
            grep "/scene/$layer/" /tmp/arm.txt | grep -qv 'ferroscope.Geometry' && exit 1
          done
          grep '/scene/tf/' /tmp/arm.txt | grep -qv 'ferroscope.Transform' && exit 1
          echo "every channel carries the schema its name implies"

  scene:
    # The authoring surface: a described scene must record, verify against its own receipt, and
    # move the things it says it moves. The last one is the check that matters — geometry
    # declared in the wrong frame still renders, it just never goes anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-cli
      - name: a described scene becomes a verified recording
        run: |
          B=target/release/ferroscope
          $B scene examples/scenes/warehouse.json warehouse.mcap | tee /tmp/scene.txt
          $B verify warehouse.mcap
          grep -q "VERIFIED" <($B verify warehouse.mcap)
          # Every body in the scene must reach the recording, with its own frame and a
          # transform stream addressing that frame.
          $B inspect warehouse.mcap > /tmp/insp.txt
          for id in crate beacon shuttle; do
            grep -q "/scene/body/$id" /tmp/insp.txt || { echo "no geometry for $id"; exit 1; }
            grep -q "/scene/tf/$id"   /tmp/insp.txt || { echo "no transform for $id"; exit 1; }
          done
          grep -q "/scene/arm/tf/base_link" /tmp/insp.txt || { echo "the robot is missing"; exit 1; }
          echo "every described body and the robot reached the recording"
      - name: a sweep judges every case and fails the build when one fails
        # The exit code is the whole point: a scenario that reports failures and exits 0 is a
        # scenario nobody can gate on.
        run: |
          B=target/release/ferroscope
          rc=0; $B scene examples/scenes/drop-height.json /tmp/sw.mcap --sweep > /tmp/sw.txt 2>&1 || rc=$?
          cat /tmp/sw.txt
          test "$rc" -eq 1 || { echo "a sweep with failing cases must exit 1, got $rc"; exit 1; }
          grep -q "8 case(s), 5 passed, 3 failed" /tmp/sw.txt \
            || { echo "the shipped scenario no longer discriminates"; cat /tmp/sw.txt; exit 1; }
          # Every case is its own recording with its own receipt.
          for i in 0 1 2 3 4 5 6 7; do
            $B verify "/tmp/sw-$i.mcap" | grep -q VERIFIED || { echo "case $i does not verify"; exit 1; }
          done
          # And the cases must differ, or the parameter did nothing.
          $B verify /tmp/sw-0.mcap | grep 'trace digest' > /tmp/d0
          $B verify /tmp/sw-7.mcap | grep 'trace digest' > /tmp/d7
          cmp -s /tmp/d0 /tmp/d7 && { echo "every case produced the same run"; exit 1; }
          # The measured number is printed on a pass too, not only on a failure.
          grep -q "ok   settles within 1.5 s: settled_s\[crate\] = " /tmp/sw.txt \
            || { echo "a passing check reports no number"; exit 1; }
          echo "8 cases judged, each verified, each distinct"
      - name: a check scoped to a body does not silently measure the scene
        # The defect this pins: with a robot in the scene the scene-wide minimum is the robot's,
        # so an unscoped check named after the crate is a statement about the arm.
        run: |
          B=target/release/ferroscope
          cat > /tmp/scope.json <<'JSON'
          {"duration_s":0.6,"rate_hz":30,
           "bodies":[{"id":"crate","shape":"box","size":[0.2,0.2,0.2],
                      "motion":{"kind":"static","at":[0,0,0.1]}},
                     {"id":"sinker","shape":"box","size":[0.2,0.2,0.2],
                      "motion":{"kind":"static","at":[0,0,-3]}}],
           "checks":[{"name":"scoped","measure":"lowest_point","of":"crate","at_least":-0.001},
                     {"name":"whole scene","measure":"lowest_point","at_least":-0.001}]}
          JSON
          rc=0; $B scene /tmp/scope.json /tmp/scope.mcap --sweep > /tmp/scope.txt 2>&1 || rc=$?
          cat /tmp/scope.txt
          test "$rc" -eq 1 || { echo "the unscoped check must fail the sweep, got $rc"; exit 1; }
          grep -q "ok   scoped" /tmp/scope.txt || { echo "the scoped check should pass"; exit 1; }
          grep -q "FAIL whole scene" /tmp/scope.txt || { echo "the unscoped check should fail"; exit 1; }
          echo "a scoped check measures what it names"
      - name: a bad scene is refused with the path that was wrong
        run: |
          B=target/release/ferroscope
          cat > /tmp/bad.json <<'JSON'
          {"duration_s":-1,"bodies":[{"id":"a","shape":"cube","size":[1,1],
                                      "motion":{"kind":"drop"}}]}
          JSON
          rc=0; $B scene /tmp/bad.json /tmp/bad.mcap 2>/tmp/err.txt || rc=$?
          test "$rc" -eq 1 || { echo "a bad scene must exit 1, got $rc"; exit 1; }
          for want in 'duration_s' 'bodies[0].shape' 'bodies[0].size' 'bodies[0].motion.kind'; do
            grep -qF "$want" /tmp/err.txt || { echo "no problem reported for $want"; cat /tmp/err.txt; exit 1; }
          done
          # And the refusal must name the alternatives, not just say no.
          grep -q "oscillate" /tmp/err.txt || { echo "the refusal does not list the motions"; exit 1; }
          echo "every problem is named with its path"

  say:
    # English in, a recording out — and the report that makes it usable: what it understood,
    # what it filled in, and which words it could not use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-cli
      - name: a sentence becomes a verified recording
        run: |
          B=target/release/ferroscope
          $B say "drop three red crates from 2 m beside an SO-101 arm onto a conveyor belt for 6 seconds" \
             said.mcap --json | tee /tmp/say.txt
          $B verify said.mcap | grep -q VERIFIED || { echo "the said scene does not verify"; exit 1; }
          # Three crates AND the built-in robot, which the binary carries rather than reading
          # off disk — `cargo install` users have no examples/ directory.
          $B inspect said.mcap > /tmp/i.txt
          for id in crate1 crate2 crate3; do
            grep -q "/scene/tf/$id" /tmp/i.txt || { echo "no $id"; exit 1; }
          done
          grep -q "/scene/arm/tf/base_link" /tmp/i.txt || { echo "the built-in robot did not load"; exit 1; }
          # It must SAY what it could not use, or a sentence silently loses half its meaning.
          grep -q 'NOT USED' /tmp/say.txt || { echo "it did not report the words it ignored"; exit 1; }
          grep -q 'conveyor' /tmp/say.txt || { echo "conveyor was dropped in silence"; exit 1; }
          grep -q '"duration_s": 6' /tmp/say.txt || { echo "\"for 6 seconds\" was not honoured"; exit 1; }
          # And filler must NOT be reported, or the word that mattered is buried.
          grep -E 'NOT USED.*"(a|the|onto)"' /tmp/say.txt && { echo "filler reported as ignored"; exit 1; }
          echo "a sentence recorded, verified, and reported honestly"
      - name: the embedded robots are the same files the repository shows
        # The CLI embeds its descriptions because a published tarball contains only the crate
        # directory — an include_str! reaching into examples/ compiles locally and fails at
        # `cargo publish`. Two copies can drift into two different robots under one name, so
        # they are compared rather than trusted.
        run: |
          for r in so101 arm; do
            cmp "examples/robots/$r.urdf" "crates/ferroscope-cli/robots/$r.urdf" \
              || { echo "$r.urdf has drifted between examples/ and the crate"; exit 1; }
          done
          echo "the embedded robots match the repository's copies"
      - name: a phrase naming nothing is refused with a way forward
        run: |
          B=target/release/ferroscope
          rc=0; $B say "make it look nice" /tmp/x.mcap 2>/tmp/e.txt || rc=$?
          test "$rc" -eq 1 || { echo "an unreadable phrase must exit 1, got $rc"; exit 1; }
          grep -q "names a thing" /tmp/e.txt || { cat /tmp/e.txt; exit 1; }
          grep -q "crate" /tmp/e.txt || { echo "the refusal offers no way forward"; exit 1; }
          test ! -e /tmp/x.mcap || { echo "a refused phrase still wrote a file"; exit 1; }
          echo "refused, with the vocabulary and the unusable words named"

  mcp:
    # The agent-facing surface, driven exactly as a client drives it: handshake, tool list, and
    # a scene authored, refused, corrected and recorded over stdio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-mcp
      - name: the server speaks MCP and records what it is asked for
        run: |
          python3 - > /tmp/in.jsonl <<'PY'
          import json
          def call(i, n, a): print(json.dumps({"jsonrpc":"2.0","id":i,"method":"tools/call",
                                               "params":{"name":n,"arguments":a}}))
          print(json.dumps({"jsonrpc":"2.0","id":0,"method":"initialize","params":{}}))
          print(json.dumps({"jsonrpc":"2.0","method":"notifications/initialized"}))
          print(json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/list"}))
          call(2, "scene_validate", {"scene": json.dumps(
              {"bodies":[{"id":"a","shape":"cube","motion":{"kind":"drop"}}]})})
          call(3, "scene_record", {"out":"/tmp/mcp.mcap","scene": json.dumps(
              {"name":"ci","duration_s":1.0,"rate_hz":60,
               "bodies":[{"id":"ball","shape":"sphere","size":[0.1,0.1,0.1],
                          "motion":{"kind":"fall","from":[0,0,2]}}]})})
          call(4, "run_verify", {"run":"/tmp/mcp.mcap"})
          call(5, "materials_search", {"query":"aluminium","limit":3})
          PY
          target/release/ferroscope-mcp < /tmp/in.jsonl > /tmp/out.jsonl
          python3 - <<'PY'
          import json, sys
          out = {}
          for line in open('/tmp/out.jsonl'):
              d = json.loads(line)
              out[d.get('id')] = d
          def fail(m):
              print('FAIL:', m); sys.exit(1)

          # A notification must NOT be answered; only ids 0..5 may appear.
          assert set(out) <= {0,1,2,3,4,5}, f'unexpected replies: {sorted(out)}'
          if out[0]['result']['serverInfo']['name'] != 'ferroscope': fail('bad serverInfo')
          names = {t['name'] for t in out[1]['result']['tools']}
          for t in ['scene_schema','scene_validate','scene_record','robot_check',
                    'mesh_check','materials_search','run_inspect','run_verify',
                    'run_energy','run_diff']:
              if t not in names: fail(f'tool {t} is not listed')

          bad = out[2]['result']
          if not bad['isError']: fail('an invalid scene must come back as an error')
          txt = bad['content'][0]['text']
          for want in ['bodies[0].shape', 'bodies[0].motion.kind', 'oscillate']:
              if want not in txt: fail(f'the refusal does not mention {want}: {txt}')

          rec = out[3]['result']
          if rec['isError']: fail('recording failed: ' + rec['content'][0]['text'])
          if 'spec digest' not in rec['content'][0]['text']: fail('no receipt reported')

          if 'VERIFIED' not in out[4]['result']['content'][0]['text']: fail('the run does not verify')

          # The spelling fix: the table is US English, the query is not.
          mats = out[5]['result']['content'][0]['text']
          if 'Aluminum' not in mats: fail('"aluminium" found no aluminium: ' + mats)
          print('MCP: handshake, 10 tools, refusal with paths, record, verify, materials')
          PY

  power:
    # The measuring path runs against a synthetic powercap tree, so it is exercised on every
    # runner rather than only on Linux hardware with root. A code path that can only run on a
    # machine nobody in the loop owns is a code path nobody has run.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-cli
      - name: with no meter, it refuses to invent joules
        run: |
          B=target/release/ferroscope
          # An empty tree: a powercap directory with nothing in it, so RAPL is definitively absent.
          export FERROSCOPE_POWERCAP="$(mktemp -d)"
          $B power | tee /tmp/none.txt
          grep -q "no power interface" /tmp/none.txt \
            || { echo "an unavailable meter must say so"; exit 1; }
          # It must still run the command, and must NOT print a joules figure.
          $B power -- sh -c 'echo ran' | tee /tmp/run.txt
          grep -q "ran" /tmp/run.txt || { echo "the command did not run"; exit 1; }
          grep -q "NOT MEASURED" /tmp/run.txt || { echo "it should say the energy is not measured"; exit 1; }
          grep -q "E_compute" /tmp/run.txt && { echo "it invented a joules figure"; exit 1; }
          # And a failing command must still propagate its status.
          rc=0; $B power -- sh -c 'exit 3' > /dev/null || rc=$?
          test "$rc" -eq 1 || { echo "a failing command must propagate, got $rc"; exit 1; }
          echo "no meter: says why, runs the command, quotes nothing"
      - name: with a meter, it measures and the number matches the counter
        run: |
          B=$PWD/target/release/ferroscope
          D=$(mktemp -d)/powercap; mkdir -p "$D/intel-rapl:0"
          E="$D/intel-rapl:0/energy_uj"
          printf 'package-0\n'  > "$D/intel-rapl:0/name"
          printf '0\n'          > "$E"
          printf '4294967295\n' > "$D/intel-rapl:0/max_energy_range_uj"
          # A counter driven from the wall clock, aiming at 20 W.
          python3 -c "
          import os, time, sys
          p = sys.argv[1]; t0 = time.monotonic()
          # Write-to-temp then rename: a truncate-then-write leaves a window where the reader
          # sees an empty file, which reads as an unreadable counter and fails the run for the
          # fixture's race rather than any product defect. A real sysfs node cannot be empty.
          while time.monotonic() - t0 < 6.0:
              tmp = p + '.tmp'
              open(tmp, 'w').write(str(int((time.monotonic() - t0) * 20.0 * 1e6)) + chr(10))
              os.replace(tmp, p)
              time.sleep(0.02)
          " "$E" &
          WRITER=$!
          # time.time(), not time.monotonic(): monotonic's reference point is per-process, so
          # differencing it across two `python3 -c` calls compares two unrelated origins.
          # The truth to compare against is what the counter ACTUALLY did over the window, not
          # the rate it was aiming for. A CI runner can starve the writer, the file then goes
          # stale, and the meter correctly reports the lower real rate — asserting against the
          # nominal 20 W would fail the meter for the fixture's scheduling. Reading the counter
          # either side of the run makes both sides see the same reality.
          read -r E0 T0 <<< "$(cat "$E") $(python3 -c 'import time; print(time.time())')"
          FERROSCOPE_POWERCAP="$D" $B power --out /tmp/m.mcap --rate 10 -- sh -c 'sleep 2' | tee /tmp/m.txt
          read -r E1 T1 <<< "$(cat "$E") $(python3 -c 'import time; print(time.time())')"
          kill "$WRITER" 2>/dev/null || true; wait "$WRITER" 2>/dev/null || true

          grep -q "top-level domain" /tmp/m.txt || { echo "the override did not open the meter"; exit 1; }
          $B verify /tmp/m.mcap | grep -q VERIFIED || { echo "the measured run does not verify"; exit 1; }
          E0="$E0" E1="$E1" T0="$T0" T1="$T1" python3 - <<'PYCHK'
          import os, re, sys
          t = open('/tmp/m.txt').read()
          m = re.search(r'mean power\s+([0-9.]+) W', t)
          assert m, 'no mean power reported:\n' + t
          got = float(m.group(1))
          truth = (int(os.environ['E1']) - int(os.environ['E0'])) * 1e-6 / \
                  (float(os.environ['T1']) - float(os.environ['T0']))
          assert truth > 1.0, f'the fixture never advanced: {truth} W'
          # Mean power, not total joules: the meter samples a sub-window of what the shell
          # measured, which changes the total but not the average of a steady rate — observed
          # agreement is about 2 %. The band is set for a loaded runner, and its resolution is
          # stated rather than implied: this catches factor-level errors (a halved or doubled
          # rate, a double-counted domain) and deliberately does NOT catch a systematic error
          # under ~15 %. The exact arithmetic is pinned by the unit tests, where no scheduler
          # is involved at all.
          lo, hi = truth * 0.82, truth * 1.20
          assert lo < got < hi, f'meter said {got} W, the counter actually did {truth:.3f} W'
          j = float(re.search(r'E_compute\s+([0-9.]+) J', t).group(1))
          assert j > 0, f'no energy reported: {j}'
          print(f'meter {got} W vs counter {truth:.3f} W over the same window, {j} J')
          PYCHK

      - name: what a recording cost to produce is in the file, and outside both digests
        # The invariant: production cost is measured, varies run to run, and must never touch
        # the determinism claim. A measured run and an unmeasured run of the same scene must
        # agree digest for digest, and both must verify.
        run: |
          B=$PWD/target/release/ferroscope
          D=$(mktemp -d)/powercap; mkdir -p "$D/intel-rapl:0"
          printf 'package-0\n'  > "$D/intel-rapl:0/name"
          printf '0\n'          > "$D/intel-rapl:0/energy_uj"
          printf '4294967295\n' > "$D/intel-rapl:0/max_energy_range_uj"
          python3 -c "
          import os, time, sys
          p = sys.argv[1]; t0 = time.monotonic()
          # Atomic replace, not truncate-then-write: the reader must never see an empty file.
          while time.monotonic() - t0 < 12.0:
              tmp = p + '.tmp'
              open(tmp, 'w').write(str(int((time.monotonic() - t0) * 20.0 * 1e6)) + chr(10))
              os.replace(tmp, p)
              time.sleep(0.01)
          " "$D/intel-rapl:0/energy_uj" &
          WRITER=$!
          FERROSCOPE_POWERCAP="$D" $B scene examples/scenes/warehouse.json /tmp/measured.mcap > /tmp/m.txt 2>&1
          E=$(mktemp -d)   # an empty powercap: definitively no meter
          FERROSCOPE_POWERCAP="$E" $B scene examples/scenes/warehouse.json /tmp/plain.mcap > /dev/null 2>&1
          kill "$WRITER" 2>/dev/null || true; wait "$WRITER" 2>/dev/null || true

          grep -Eq "production   [0-9.]+ J measured" /tmp/m.txt \
            || { echo "the measured run reported no production cost"; cat /tmp/m.txt; exit 1; }
          $B inspect /tmp/measured.mcap > /tmp/mi.txt
          grep -q "production" /tmp/mi.txt && grep -Eq "joules +[0-9.]+" /tmp/mi.txt \
            || { echo "the production block is not in the file"; exit 1; }
          # The unmeasured file must carry the REASON, and no joules figure at all.
          $B inspect /tmp/plain.mcap > /tmp/pi.txt
          grep -q "unavailable" /tmp/pi.txt || { echo "the unmeasured file does not say why"; exit 1; }
          grep -Eq "joules +[0-9.]+" /tmp/pi.txt && { echo "an unmeasured file invented joules"; exit 1; }
          # Both verify, and the digests are identical: the measurement never touches the claim.
          $B verify /tmp/measured.mcap | grep -q VERIFIED || { echo "measured run does not verify"; exit 1; }
          $B verify /tmp/plain.mcap    | grep -q VERIFIED || { echo "plain run does not verify"; exit 1; }
          for which in 'trace digest' 'spec digest'; do
            A=$($B verify /tmp/measured.mcap | grep "$which" | awk '{print $3}')
            C=$($B verify /tmp/plain.mcap    | grep "$which" | awk '{print $3}')
            test -n "$A" || { echo "no $which found"; exit 1; }
            test "$A" = "$C" || { echo "the production note moved the $which: $A vs $C"; exit 1; }
          done
          echo "production cost is in the file, said honestly, and outside both digests"
      - name: the subdomain trap stays shut
        run: |
          B=$PWD/target/release/ferroscope
          D=$(mktemp -d)/powercap
          for d in "intel-rapl:0" "intel-rapl:0:0" "intel-rapl:0:1"; do
            mkdir -p "$D/$d"; printf '%s\n' "$d" > "$D/$d/name"
            printf '1000000\n' > "$D/$d/energy_uj"; printf '4294967295\n' > "$D/$d/max_energy_range_uj"
          done
          FERROSCOPE_POWERCAP="$D" $B power | tee /tmp/nest.txt
          # One top-level domain, not three: a core's joules are already inside its package.
          grep -q "1 top-level domain" /tmp/nest.txt \
            || { echo "subdomains were counted as their own domains"; cat /tmp/nest.txt; exit 1; }
          echo "nested RAPL domains are not double-counted"

  motion:
    # Real dynamics under the receipt: ferromotion drives the SO-101's calibrated inertials and
    # the recording carries an actuation rail computed from the applied torques. Two gates:
    # the integrator must hold energy in a passive drop, and two identical runs must produce
    # identical digests — the determinism claim, on an actual simulator rather than closed form.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-motion -p ferroscope-cli
      - name: the embedded description matches the repository's
        run: |
          cmp examples/robots/so101.urdf crates/ferroscope-motion/robots/so101.urdf \
            || { echo "the motion crate's so101.urdf has drifted"; exit 1; }
      - name: gravity cannot mint energy
        # The binary itself enforces the 5 % drift bound and exits 1 past it. The first version
        # of this crate failed this gate at 12.31 % — the missing armature — so it has already
        # caught one real physics bug.
        run: |
          ./target/release/ferroscope-motion /tmp/passive.mcap --passive --duration 3 | tee /tmp/p.txt
          grep -q "holds energy within" /tmp/p.txt || { echo "no verdict printed"; exit 1; }
          ./target/release/ferroscope verify /tmp/passive.mcap | grep -q VERIFIED \
            || { echo "the passive run does not verify"; exit 1; }
          # Passive means passive: an unactuated fall must cost zero shaft work.
          ./target/release/ferroscope energy /tmp/passive.mcap | grep -Eq "actuation +0\.000 J" \
            || { echo "an unactuated run reported actuation energy"; exit 1; }
      - name: the same experiment twice is the same digest
        run: |
          B=./target/release/ferroscope
          ./target/release/ferroscope-motion /tmp/r1.mcap --duration 2 > /dev/null
          ./target/release/ferroscope-motion /tmp/r2.mcap --duration 2 > /dev/null
          A=$($B verify /tmp/r1.mcap | grep 'trace digest' | awk '{print $3}')
          C=$($B verify /tmp/r2.mcap | grep 'trace digest' | awk '{print $3}')
          test -n "$A" && test "$A" = "$C" \
            || { echo "real dynamics diverged between identical runs: $A vs $C"; exit 1; }
          # And the ledger's actuation is computed, non-zero, and attributed to a joint.
          $B energy /tmp/r1.mcap | tee /tmp/e.txt
          grep -Eq "actuation +[0-9]+\.[0-9]+ J" /tmp/e.txt || { echo "no actuation figure"; exit 1; }
          grep -Eq "peak +[0-9.]+ W +actuation/(shoulder|elbow|wrist)" /tmp/e.txt \
            || { echo "the peak is not attributed to a joint"; exit 1; }
          echo "identical digests, computed actuation, attributed peak"

  live:
    # The streaming invariant, over a real socket: every WebSocket frame is one MCAP record, so
    # a client that appends what it receives holds the byte-identical file — and the moment the
    # producer seals, that file verifies. Live viewing and archived evidence are one format at
    # two moments, and this job holds the two moments equal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroscope-motion -p ferroscope-cli
      - name: the stream is the file
        run: |
          ./target/release/ferroscope-motion /tmp/served.mcap --serve 0 --duration 2 > /tmp/serve.log 2>&1 &
          SRV=$!
          for i in $(seq 1 100); do grep -q "ws://localhost:" /tmp/serve.log && break; sleep 0.1; done
          PORT=$(grep -o "ws://localhost:[0-9]*" /tmp/serve.log | grep -o "[0-9]*$")
          test -n "$PORT" || { echo "the producer never announced a port"; cat /tmp/serve.log; exit 1; }
          python3 ci/wsclient.py 127.0.0.1 "$PORT" /tmp/streamed.mcap
          wait "$SRV"
          cmp /tmp/served.mcap /tmp/streamed.mcap \
            || { echo "the streamed bytes differ from the file"; exit 1; }
          ./target/release/ferroscope verify /tmp/streamed.mcap | grep -q VERIFIED \
            || { echo "the streamed file does not verify"; exit 1; }
          # The viewer's failure message must keep teaching the Local Network Access
          # permission: a public page reaching localhost is blocked until the user allows it,
          # and a message that just says "failed" strands exactly the person it was for.
          grep -q "local network access" viewer/index.html \
            || { echo "the live error no longer explains the LNA permission"; exit 1; }
          echo "a WebSocket client holds the byte-identical, receipt-verified file"
      - name: any file replays as a live stream
        # `ferroscope live` closes the loop from the other side: an existing recording served
        # over the same transports, paced by its own clock. Five clients join at staggered
        # instants MID-burst — the adversarial case for the join path, where a record
        # broadcast during a snapshot must reach the joiner exactly once — and every one of
        # them must end up holding the byte-identical file.
        run: |
          ./target/release/ferroscope demo /tmp/replay-src.mcap --steps 4000 > /dev/null
          ./target/release/ferroscope live /tmp/replay-src.mcap --port 0 --rate 4 --no-wait --hold 6 > /tmp/replay.log 2>&1 &
          SRV=$!
          for i in $(seq 1 100); do grep -q "ws://localhost:" /tmp/replay.log && break; sleep 0.1; done
          PORT=$(grep -o "ws://localhost:[0-9]*" /tmp/replay.log | grep -o "[0-9]*$")
          test -n "$PORT" || { echo "the replay never announced a port"; cat /tmp/replay.log; exit 1; }
          for i in 1 2 3 4 5; do
            python3 ci/wsclient.py 127.0.0.1 "$PORT" /tmp/replay-$i.mcap > /dev/null 2>&1 &
            sleep 0.15
          done
          wait
          for i in 1 2 3 4 5; do
            cmp /tmp/replay-src.mcap /tmp/replay-$i.mcap \
              || { echo "mid-burst joiner $i holds a different file"; exit 1; }
          done
          ./target/release/ferroscope verify /tmp/replay-3.mcap | grep -q VERIFIED \
            || { echo "a replayed stream does not verify"; exit 1; }
          echo "five mid-burst joiners each hold the byte-identical, receipt-verified file"
      - name: a stalled viewer never freezes the producer
        # The promise "a browser tab must never back-pressure a simulation" was aspirational:
        # a blocking write to a peer that stopped reading blocks forever, and the single accept
        # thread does the catch-up write, so one paused tab wedged every later viewer too.
        # A viewer that completes the handshake and then reads NOTHING must be dropped while a
        # healthy viewer still receives the whole file.
        run: |
          ./target/release/ferroscope live /tmp/replay-src.mcap --port 0 --rate 8 --no-wait --hold 4 > /tmp/stall.log 2>&1 &
          PROD=$!
          for i in $(seq 1 100); do grep -q "ws://localhost:" /tmp/stall.log && break; sleep 0.1; done
          PORT=$(grep -o "ws://localhost:[0-9]*" /tmp/stall.log | grep -o "[0-9]*$")
          test -n "$PORT" || { echo "no port announced"; cat /tmp/stall.log; exit 1; }
          python3 ci/stallclient.py 127.0.0.1 "$PORT" 120 > /tmp/stall-client.log 2>&1 &
          STALLER=$!
          sleep 1
          rc=0
          timeout 180 python3 ci/wsclient.py 127.0.0.1 "$PORT" /tmp/stall-good.mcap > /dev/null 2>&1 || rc=$?
          test "$rc" = 0 \
            || { echo "the healthy viewer could not complete (rc=$rc) — the producer is wedged"; cat /tmp/stall.log; exit 1; }
          wait "$PROD" || true
          kill "$STALLER" 2>/dev/null || true
          cmp /tmp/replay-src.mcap /tmp/stall-good.mcap \
            || { echo "the healthy viewer's file differs while a peer was stalled"; exit 1; }
          grep -q "streamed to  1 viewer" /tmp/stall.log \
            || { echo "the producer did not drop the stalled viewer"; cat /tmp/stall.log; exit 1; }
          echo "a stalled viewer was dropped; the healthy one holds the byte-identical file"
      - name: the stream is the file, over QUIC too
        # Same invariant, second transport: one unidirectional WebTransport stream carries the
        # raw recording bytes, FIN at seal. The probe is wtransport's own client with cert
        # validation off — the browser holds the same trust through the printed hash instead.
        run: |
          cargo build --release -p ferroscope-live --features webtransport --examples
          ./target/release/ferroscope-motion /tmp/wt-served.mcap --serve-wt 0 --duration 2 > /tmp/wt.log 2>&1 &
          SRV=$!
          for i in $(seq 1 100); do grep -q "webtransport https://" /tmp/wt.log && break; sleep 0.1; done
          URL=$(grep -o "https://127.0.0.1:[0-9]*" /tmp/wt.log | head -1)
          test -n "$URL" || { echo "no WebTransport url announced"; cat /tmp/wt.log; exit 1; }
          timeout 30 ./target/release/examples/wt-probe "$URL" /tmp/wt-streamed.mcap
          wait "$SRV"
          cmp /tmp/wt-served.mcap /tmp/wt-streamed.mcap \
            || { echo "the QUIC stream differs from the file"; exit 1; }
          ./target/release/ferroscope verify /tmp/wt-streamed.mcap | grep -q VERIFIED \
            || { echo "the streamed file does not verify"; exit 1; }
          # The producer must print the clickable viewer link with the certificate hash.
          grep -Eq "viewer\?wt=https://127.0.0.1:[0-9]+&hash=[0-9a-f]{64}" /tmp/wt.log \
            || { echo "no connectable viewer link printed"; exit 1; }
          echo "a WebTransport client holds the byte-identical, receipt-verified file"
      - name: any file replays over QUIC too
        # The same replay, second transport: `ferroscope live --wt` waits for its first
        # viewer, streams the file down one unidirectional stream, and FINs at the seal.
        run: |
          cargo build --release -p ferroscope-cli --features webtransport
          ./target/release/ferroscope live /tmp/replay-src.mcap --wt --rate 4 > /tmp/replay-wt.log 2>&1 &
          SRV=$!
          for i in $(seq 1 100); do grep -q "webtransport https://" /tmp/replay-wt.log && break; sleep 0.1; done
          URL=$(grep -o "https://127.0.0.1:[0-9]*" /tmp/replay-wt.log | head -1)
          test -n "$URL" || { echo "no WebTransport url announced"; cat /tmp/replay-wt.log; exit 1; }
          timeout 60 ./target/release/examples/wt-probe "$URL" /tmp/replay-wt.mcap
          wait "$SRV"
          cmp /tmp/replay-src.mcap /tmp/replay-wt.mcap \
            || { echo "the QUIC replay differs from the file"; exit 1; }
          grep -Eq "viewer\?wt=https://127.0.0.1:[0-9]+&hash=[0-9a-f]{64}" /tmp/replay-wt.log \
            || { echo "the replay printed no connectable viewer link"; exit 1; }
          echo "a QUIC replay client holds the byte-identical file"
      - name: a QUIC viewer that falls behind is caught up, not truncated
        # The sharpest bug this transport has had: on QUIC, dropping a send stream is a
        # graceful FIN, and FIN is how this protocol says "sealed, what you hold is the file".
        # A session that gave up on a lagging viewer therefore handed it a valid PREFIX wearing
        # the seal's own signal, and both sides reported success. Replaying a large file at a
        # rate that outruns the channel is the reproduction; it must now be byte-identical
        # every time, because a lagging session re-reads what it missed from history.
        run: |
          ./target/release/ferroscope demo /tmp/lag-src.mcap --steps 40000 > /dev/null
          for run in 1 2 3; do
            ./target/release/ferroscope live /tmp/lag-src.mcap --wt --rate 200 > /tmp/lag-$run.log 2>&1 &
            LAGPROD=$!
            for i in $(seq 1 200); do grep -q "webtransport https://" /tmp/lag-$run.log && break; sleep 0.1; done
            URL=$(grep -o "https://127.0.0.1:[0-9]*" /tmp/lag-$run.log | head -1)
            test -n "$URL" || { echo "no url announced"; cat /tmp/lag-$run.log; exit 1; }
            prc=0
            timeout 120 ./target/release/examples/wt-probe "$URL" /tmp/lag-$run.mcap > /tmp/lag-probe-$run.log 2>&1 || prc=$?
            rc=0; wait "$LAGPROD" || rc=$?
            test "$prc" = 0 \
              || { echo "run $run: the viewer's stream did not end at the seal (probe rc=$prc)"; cat /tmp/lag-probe-$run.log; cat /tmp/lag-$run.log; exit 1; }
            test "$rc" = 0 \
              || { echo "run $run: the producer reports a viewer without the sealed file (rc=$rc)"; cat /tmp/lag-$run.log; exit 1; }
            cmp /tmp/lag-src.mcap /tmp/lag-$run.mcap \
              || { echo "run $run: a lagging QUIC viewer was handed a truncated file"; cat /tmp/lag-$run.log; exit 1; }
          done
          echo "three fast QUIC replays, every viewer byte-identical, none abandoned"

  viewer:
    # The committed wasm bundle must still be the one this source produces, so a visitor never
    # loads a stale build of a since-changed comparator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: ./viewer/build.sh
      - name: the bundle landed in viewer/pkg and nowhere else
        # wasm-pack resolves --out-dir against the crate path, so this check once passed
        # vacuously while the real bundle was never rewritten.
        run: |
          test ! -d crates/ferroscope-wasm/viewer
          test -s viewer/pkg/ferroscope_wasm_bg.wasm
          find viewer/pkg -newermt '-10 minutes' -name '*.wasm' | grep -q wasm
      - name: the committed bundle exports everything the crate does
        # A byte-diff was the wrong invariant: an optimized wasm is not reproducible across
        # wasm-opt and rustc versions, so that check failed on a clean rebuild for a reason
        # nobody could act on. The invariant that DOES hold, and that catches the real failure
        # (a bundle committed before a new export was added), is the export surface.
        run: |
          # A while-read loop rather than `for f in $var`: unquoted word splitting differs
          # between shells, and a check whose iteration count depends on the shell is a check
          # that can pass by accident.
          grep -B1 '^pub fn' crates/ferroscope-wasm/src/lib.rs \
            | grep -A1 wasm_bindgen | grep '^pub fn' \
            | sed 's/pub fn \([a-z_0-9]*\).*/\1/' | sort -u > /tmp/exports.txt
          test -s /tmp/exports.txt
          while read -r f; do
            grep -q "^export function $f" viewer/pkg/ferroscope_wasm.js \
              || { echo "the committed viewer bundle is missing export: $f"; exit 1; }
            echo "ok $f"
          done < /tmp/exports.txt
          # The viewer also loads three.js from the repository rather than a CDN. If that is
          # ever removed the page fails at import time, so it is checked here.
          test -s viewer/vendor/three/three.webgpu.min.js
          test -s viewer/vendor/three/three.core.min.js
          test -s viewer/vendor/three/addons/controls/OrbitControls.js
          test -s viewer/vendor/three/addons/lines/webgpu/Line2.js
          test -s viewer/vendor/three/addons/loaders/GLTFLoader.js
          test -s viewer/vendor/three/addons/environments/RoomEnvironment.js
          ! grep -q 'https://unpkg\|https://cdn' viewer/index.html

  no-deps:
    # The other claim on the tin. `cargo tree` for each core crate must list the crate and
    # nothing else; a transitive dependency that arrives by accident fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: core crates have no runtime dependencies
        run: |
          for c in ferroscope-mcap ferroscope-ledger ferroscope-receipt ferroscope-mesh \
                   ferroscope-power ferroscope-live; do
            n=$(cargo tree -p $c --edges normal --prefix none | grep -v '^$' | sort -u | wc -l)
            echo "$c: $n crate(s) in the runtime graph"
            [ "$n" -eq 1 ] || { cargo tree -p $c --edges normal; exit 1; }
          done

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: the package is ferroscope-cli, the binary is ferroscope
        run: test -x target/release/ferroscope
      - name: a run verifies, a drifted replay is located
        run: |
          B=target/release/ferroscope
          $B demo a.mcap
          $B demo b.mcap --platform "ci-linux"
          $B demo c.mcap --platform "ci-linux" --drift 320
          $B verify a.mcap
          $B energy a.mcap
          $B diff a.mcap b.mcap                 # exit 0: same spec, two platforms, one answer
          rc=0; $B diff a.mcap c.mcap > /dev/null || rc=$?   # exit 1: located divergence
          test "$rc" -eq 1 || { echo "a diverged pair must exit 1, got $rc"; exit 1; }
      - name: diff recomputes both receipts instead of trusting metadata
        # The hole this closes: diff used to compare two STORED digest strings read out of
        # metadata and return exit 0 on a match. A file whose block was edited to carry
        # another run's trace_digest therefore passed with arbitrarily different messages, so
        # a green diff proved that two metadata blocks agreed — not that two runs reproduced.
        # Verified against the previous release, which exits 0 on the file this step forges.
        run: |
          B=target/release/ferroscope
          python3 - <<'EOF'
          import re
          a = open('a.mcap','rb').read()
          c = open('c.mcap','rb').read()
          def stored(buf):
              i = buf.find(b'trace_digest')
              return re.search(rb'[0-9a-f]{64}', buf[i:i+200]).group(0)
          forged = c.replace(stored(c), stored(a), 1)
          assert len(forged) == len(c), "the forgery must not change the file length"
          assert forged != c, "the forgery did not change anything"
          open('forged.mcap','wb').write(forged)
          EOF
          rc=0; $B diff a.mcap forged.mcap > /tmp/forged.log 2>&1 || rc=$?
          test "$rc" -ne 0 \
            || { echo "a file carrying another run's stored digest passed diff"; cat /tmp/forged.log; exit 1; }
          grep -q "DOES NOT VERIFY" /tmp/forged.log \
            || { echo "diff did not report that the forged file fails its own receipt"; cat /tmp/forged.log; exit 1; }
          # And the honest file must still pass, or the check above proves nothing.
          $B diff a.mcap b.mcap > /dev/null \
            || { echo "an honest pair no longer passes"; exit 1; }
          echo "diff recomputes both receipts: a forged digest is caught, an honest pair passes"
